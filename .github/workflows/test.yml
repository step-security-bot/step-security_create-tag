name: 'build-test'
on: # rebuild any PRs and main branch changes
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          npm install
      - run: |
          npm run all
